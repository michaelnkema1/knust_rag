# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for LLM_API_KEY.
services:
  - type: web
    name: knust-rag
    runtime: python
    plan: free
    # Download the embedding model during the build, so the first request doesn't have to.
    buildCommand: pip install -r requirements.txt && python -m src.embed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_API_KEY
        sync: false            # secret: entered in the dashboard, never committed
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: PROMPT_VERSION
        value: v2
      - key: CHUNK_SIZE
        value: "300"
      - key: TOP_K
        value: "10"
      - key: RETRIEVAL_MODE
        value: vector
      - key: EMBED_THREADS
        value: "1"             # free instances have a fraction of one CPU
      - key: ASK_RATE_LIMIT
        value: "8"             # questions per minute per visitor
      - key: LLM_MAX_RETRIES
        value: "1"             # fail fast for visitors instead of retrying for over a minute
