<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNUST Regulations Assistant</title>
<style>
  :root {
    --green: #0F372F;        /* brand: deep green */
    --gold: #ECBC6B;         /* brand: gold */
    --bg: #FBF6EC;
    --card: #FFFFFF;
    --ink: #1C2B27;
    --muted: #5E6B66;
    --line: #E8DFCC;
    --header: var(--green);
    --header-ink: #FBF6EC;
    --user-bg: var(--green);
    --user-ink: #FFFFFF;
    --accent: var(--gold);         /* fills: dots, progress, focus ring, logo */
    --accent-ink: var(--green);    /* text on gold */
    --btn: var(--gold);
    --btn-ink: var(--green);
    --chip-border: #D9B36E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B2722; --card: #123A33; --ink: #F3EBDB; --muted: #A9BAB3; --line: #1F4B42;
      --header: #071E1A; --header-ink: #F3EBDB; --user-bg: #1C5246; --user-ink: #FFFFFF;
      --chip-border: #ECBC6B;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }

  header { background: var(--header); color: var(--header-ink); padding: 18px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  header .wrap { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--gold); color: var(--green); display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; flex: none; }
  header h1 { font-size: 1.25rem; margin: 0; line-height: 1.2; }
  header p { margin: 2px 0 0; font-size: .88rem; opacity: .92; }

  main { flex: 1; padding: 20px 16px 24px; }
  #log { display: flex; flex-direction: column; gap: 14px; }

  .empty { text-align: center; padding: 28px 8px 8px; }
  .empty h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .empty p { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { border: 1px solid var(--chip-border); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
  .chip:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .row-msg { display: flex; gap: 10px; align-items: flex-end; }
  .row-msg.me { justify-content: flex-end; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none; }
  .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .me .bubble { background: var(--user-bg); color: var(--user-ink); border-color: transparent; border-bottom-right-radius: 4px; }
  .bot .bubble { border-bottom-left-radius: 4px; }
  .bubble.error { border-color: #B5523B; }
  .cite { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .cite button { font: inherit; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .cite button:hover, .cite button[aria-expanded="true"] { border-color: var(--accent); color: var(--ink); }
  .ref { display: inline-flex; gap: 2px; margin: 0 2px; vertical-align: 2px; }
  .ref button { font: 700 .7rem/1.5 system-ui, sans-serif; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 5px; padding: 0 6px; cursor: pointer; min-width: 18px; }
  .ref button:hover { filter: brightness(1.08); }
  .source { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; font-size: .88rem; white-space: normal; }
  .source .src-head { font-weight: 600; margin-bottom: 4px; }
  .source blockquote { margin: 0 0 8px; color: var(--muted); font-style: italic; }
  .source a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .fb { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: .82rem; color: var(--muted); white-space: normal; flex-wrap: wrap; }
  .fb button.thumb { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; cursor: pointer; color: var(--muted); font: inherit; line-height: 1.2; }
  .fb button.thumb:hover { border-color: var(--accent); color: var(--ink); }
  .fb button.thumb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .fb .why { display: flex; gap: 6px; width: 100%; margin-top: 4px; }
  .fb .why input { padding: 7px 10px; border-radius: 8px; font-size: .85rem; }
  .fb .why button { border: 0; border-radius: 8px; padding: 0 12px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 600; cursor: pointer; }

  /* Loading bubble */
  .typing { display: flex; align-items: center; gap: 12px; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-6px); opacity: 1; } }
  .status { color: var(--muted); font-size: .9rem; transition: opacity .25s; }
  .status.fade { opacity: 0; }
  .progress { height: 3px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .progress b { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 3px; animation: slide 1.6s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .dots i, .progress b { animation: none; } .dots i { opacity: .8; } }

  form { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button.send { padding: 0 20px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 700; cursor: pointer; }
  button.send:hover { filter: brightness(1.06); }
  button.send:disabled { opacity: .55; cursor: wait; }
  .foot { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo" aria-hidden="true">K</div>
    <div>
      <h1>KNUST Regulations Assistant</h1>
      <p>Answers from the official Students' Guide, with page citations</p>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="log" aria-live="polite">
      <div class="empty" id="empty">
        <h2>What would you like to know?</h2>
        <p>Ask about exams, registration, student services, conduct rules and more.</p>
        <div class="chips">
          <button class="chip" type="button">Where can I get counselling support?</button>
          <button class="chip" type="button">What counts as exam malpractice?</button>
          <button class="chip" type="button">How do I register for my courses?</button>
          <button class="chip" type="button">Where do I go if I'm sick at night?</button>
        </div>
      </div>
    </div>
  </div>
</main>

<form id="f">
  <div class="wrap">
    <div class="row">
      <input id="q" placeholder="Ask a question about KNUST regulations…" autocomplete="off" required aria-label="Your question">
      <button class="send" id="b">Ask</button>
    </div>
    <div class="foot">Not an official KNUST service. Confirm important decisions with your faculty office.</div>
  </div>
</form>

<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), b = document.getElementById('b');

// Status lines shown while waiting, keyed to how long the request has been running (seconds).
const STAGES = [
  [0,  'Searching the Students’ Guide…'],
  [3,  'Reading the most relevant pages…'],
  [7,  'Writing your answer…'],
  [15, 'Checking the citations…'],
  [25, 'The AI service is busy right now — still working on it…'],
];

function row(cls) {
  document.getElementById('empty')?.remove();
  const r = document.createElement('div'); r.className = 'row-msg ' + cls;
  if (cls === 'bot') { const a = document.createElement('div'); a.className = 'avatar'; a.textContent = 'AI'; a.setAttribute('aria-hidden', 'true'); r.appendChild(a); }
  const bub = document.createElement('div'); bub.className = 'bubble'; r.appendChild(bub);
  log.appendChild(r); r.scrollIntoView({behavior: 'smooth', block: 'end'});
  return bub;
}

function addUser(text) { row('me').textContent = text; }

const docName = d => d.replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const pageRange = p => p.length > 1 ? `pages ${p[0]}–${p[p.length - 1]}` : `page ${p[0]}`;

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// Answer text with [1] / [1, 4] / [1][3] turned into clickable badges that open the matching source.
function renderAnswer(container, text, citeMap, toggle) {
  const re = /\[([\d,\s]+)\]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    container.append(text.slice(last, m.index));
    const ref = el('span', {class: 'ref'});
    for (const n of m[1].match(/\d+/g)) {
      if (!citeMap[n]) continue;
      const btn = el('button', {type: 'button', 'aria-label': `Show source ${n}`, 'data-n': n}, n);
      btn.addEventListener('click', () => toggle(n));
      ref.append(btn);
    }
    if (ref.childNodes.length) container.append(ref);
    last = re.lastIndex;
  }
  container.append(text.slice(last));
}

function addBot(data, isError) {
  const bub = row('bot');
  if (isError) { bub.textContent = data; bub.classList.add('error'); return; }
  const cites = data.citations || [], citeMap = Object.fromEntries(cites.map(c => [String(c.n), c]));
  const body = el('div'); bub.append(body);
  const panel = el('div', {class: 'source', hidden: ''});
  let open = null;
  const tagButtons = {};
  const toggle = n => {
    if (open === n) { panel.hidden = true; open = null; }
    else {
      const c = citeMap[n]; panel.replaceChildren();
      panel.append(el('div', {class: 'src-head'}, `Source [${n}] · ${docName(c.doc)}, ${pageRange(c.pages)}`));
      if (c.excerpt) panel.append(el('blockquote', {}, c.excerpt));
      panel.append(el('a', {href: `/docs-pdf/${encodeURIComponent(c.doc)}#page=${c.pages[0]}`, target: '_blank', rel: 'noopener'}, `Open page ${c.pages[0]} in the PDF ↗`));
      panel.hidden = false; open = n;
    }
    for (const [k, b] of Object.entries(tagButtons)) b.setAttribute('aria-expanded', String(k === open));
  };
  renderAnswer(body, data.answer, citeMap, toggle);

  if (cites.length) {
    const c = el('div', {class: 'cite'});
    for (const x of cites) {
      const b = el('button', {type: 'button', 'aria-expanded': 'false', title: docName(x.doc)}, `[${x.n}] p. ${x.pages.join(', ')}`);
      b.addEventListener('click', () => toggle(String(x.n)));
      tagButtons[String(x.n)] = b; c.append(b);
    }
    bub.append(c, panel);
  }
  bub.append(feedbackRow(data));
  bub.parentElement.scrollIntoView({behavior: 'smooth', block: 'end'});
}

// Thumbs up/down, saved by the backend to data/feedback.jsonl. Thumbs-down can carry a short comment.
function feedbackRow(data) {
  const wrap = el('div', {class: 'fb'});
  const label = el('span', {}, 'Was this helpful?');
  const up = el('button', {type: 'button', class: 'thumb', 'aria-pressed': 'false', 'aria-label': 'Helpful'}, '👍');
  const down = el('button', {type: 'button', class: 'thumb', 'aria-pressed': 'false', 'aria-label': 'Not helpful'}, '👎');
  wrap.append(label, up, down);
  const send = async (rating, comment = '') => {
    try {
      const r = await fetch('/feedback', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: data.question, answer: data.answer, rating, comment, citations: data.citations || []})});
      if (!r.ok) throw new Error();
      wrap.replaceChildren(el('span', {}, rating === 'up' ? 'Thanks! Glad it helped.' : 'Thanks — this will help improve the assistant.'));
    } catch { label.textContent = 'Couldn’t send feedback. Try again?'; }
  };
  up.addEventListener('click', () => { up.setAttribute('aria-pressed', 'true'); send('up'); });
  down.addEventListener('click', () => {
    down.setAttribute('aria-pressed', 'true'); up.disabled = true;
    if (wrap.querySelector('.why')) return;
    const why = el('form', {class: 'why'});
    const inp = el('input', {placeholder: 'What was wrong? (optional)', maxlength: '1000', 'aria-label': 'What was wrong?'});
    why.append(inp, el('button', {type: 'submit'}, 'Send'));
    why.addEventListener('submit', e => { e.preventDefault(); send('down', inp.value.trim()); });
    wrap.append(why); inp.focus({preventScroll: true}); why.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  });
  return wrap;
}

function showTyping() {
  const bub = row('bot');
  bub.setAttribute('aria-label', 'Assistant is working on an answer');
  bub.innerHTML = '<div class="typing"><span class="dots"><i></i><i></i><i></i></span><span class="status"></span></div><div class="progress"><b></b></div>';
  const status = bub.querySelector('.status'), start = Date.now(); let shown = -1;
  const tick = () => {
    const s = (Date.now() - start) / 1000; let i = 0;
    while (i + 1 < STAGES.length && s >= STAGES[i + 1][0]) i++;
    if (i !== shown) {
      shown = i; status.classList.add('fade');
      setTimeout(() => { status.textContent = STAGES[i][1]; status.classList.remove('fade'); }, shown === 0 && !status.textContent ? 0 : 250);
    }
  };
  tick(); const timer = setInterval(tick, 500);
  return () => { clearInterval(timer); bub.parentElement.remove(); };
}

async function ask(question) {
  addUser(question); q.value = ''; b.disabled = true; q.disabled = true;
  const stop = showTyping();
  try {
    const r = await fetch('/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question})});
    const raw = await r.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { data = {detail: r.status >= 500 ? 'The server is waking up or busy. Please try again in a minute' : `Unexpected response (${r.status})`}; }
    if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail.replace(/\.$/, '') : 'Request failed');
    stop(); addBot(data);
  } catch (err) {
    const msg = err.message || 'Request failed';
    stop(); addBot(/try again/i.test(msg) ? `Sorry — ${msg}.` : `Sorry, something went wrong: ${msg}. Please try again.`, true);
  }
  b.disabled = false; q.disabled = false; q.focus();
}

f.addEventListener('submit', e => { e.preventDefault(); const t = q.value.trim(); if (t) ask(t); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => ask(c.textContent)));
</script>
</body>
</html>
